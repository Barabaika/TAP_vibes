name: TAP reference regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install HMMER and package
        run: |
          sudo apt-get update
          sudo apt-get install -y hmmer
          python -m pip install -e '.[test]'
      - name: Fetch checksum-pinned PSA (no folding weights)
        run: tap-assets --psa-only
      - name: Unit and all 10 archived web structure tests
        run: python -m pytest -q --run-structure
      # No --run-live in CI: ordinary tests do not submit public service jobs.
